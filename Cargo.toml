[package]
name = "busplan"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
flate2 = "1.1.11"
rayon = "1.12.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
ureq = { version = "3.5.2", features = ["json"] }

[profile.release]
opt-level = 3
debug = 1

[profile.dev]
opt-level = 2
